  <script>(function(){function m(a){var h=a.getAttribute("href");if(!h)return;try{var u=new URL(h,document.baseURI);if((u.protocol==="http:"||u.protocol==="https:")&&u.host!==location.host){a.target="_blank";a.rel="noopener noreferrer";}}catch(e){}}function s(){document.querySelectorAll("a[href]").forEach(m);}if(document.readyState!=="loading"){s();}else{document.addEventListener("DOMContentLoaded",s);}document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[href]");if(a){m(a);}},true);})();</script>
<script>
async function hbExportar(){
  var btn=document.getElementById('hb-export-btn');
  if(btn) btn.textContent='⏳ Gerando...';
  try{
    let html=await fetch(location.pathname,{cache:'no-store'}).then(r=>r.text());
    let nome=localStorage.getItem("hb_nome")|| (window.__HB_EXPORT&&window.__HB_EXPORT.name) || "Achados da Bia";
    let bio=localStorage.getItem("hb_bio")|| (window.__HB_EXPORT&&window.__HB_EXPORT.bio) || "";
    let foto=localStorage.getItem("hb_foto")|| (window.__HB_EXPORT&&window.__HB_EXPORT.foto) || "";
    let produtos=[];
    try{ produtos=JSON.parse(localStorage.getItem("hb_produtos")||"[]"); }catch(e){}
    if(window.__HB_EXPORT&&window.__HB_EXPORT.produtos&&window.__HB_EXPORT.produtos.length) produtos=window.__HB_EXPORT.produtos;
    var start=html.indexOf("var vv=[");
    if(start!==-1){
      var end=html.indexOf("],Dc=",start);
      if(end!==-1){
        var newVV="var vv="+JSON.stringify(produtos)+",Dc=";
        html=html.slice(0,start)+newVV+html.slice(end+5);
      }
    }
    html=html.split('"Achados da Bia"').join(JSON.stringify(nome));
    var bioJson=JSON.stringify(bio);
    html=html.replace(/localStorage\.getItem\("hb_bio"\)\|\|"[^"]*"/g, 'localStorage.getItem("hb_bio")||'+bioJson);
    if(foto){
      var fotoJson=JSON.stringify(foto);
      html=html.replace(/localStorage\.getItem\("hb_foto"\)\|\|"[^"]*"/, 'localStorage.getItem("hb_foto")||'+fotoJson);
      html=html.replace(/return null\}\}\),\[p,w\]/, 'return'+fotoJson+'}}),[p,w]');
      html=html.replace(/return"data:image[^"]*"\}\}\),\[p,w\]/, 'return'+fotoJson+'}}),[p,w]');
    }
    var blob=new Blob([html],{type:"text/html"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download="index.html"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
    if(btn){ btn.textContent="✅ Baixado!"; btn.style.background="#059669"; }
    setTimeout(function(){if(btn){ btn.textContent="📥 Baixar HTML Atualizado"; btn.style.background="linear-gradient(90deg,#ef4444,#dc2626)"; }},2500);
  }catch(err){
    alert("Erro ao exportar: "+err.message);
    if(btn) btn.textContent="📥 Baixar HTML Atualizado";
  }
}
(function(){
  try{
    if(location.hash==="#admin"){
      try{localStorage.setItem("hb_admin","1")}catch(e){}
      history.replaceState(null,"",location.pathname+location.search);
    }
    var admin=false;
    try{admin=localStorage.getItem("hb_admin")==="1"}catch(e){}
    // Botão de exportar - só aparece no modo admin
    function criarBotaoExportar(){
      if(!admin) return;
      if(document.getElementById('hb-export-btn')) return;
      var btn=document.createElement('button');
      btn.id='hb-export-btn';
      btn.textContent='📥 Baixar HTML Atualizado';
      btn.onclick=hbExportar;
      btn.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99999;background:linear-gradient(90deg,#ef4444,#dc2626);color:white;border:3px solid white;border-radius:9999px;padding:16px 28px;font-weight:900;font-size:16px;box-shadow:0 10px 30px rgba(0,0,0,0.5);cursor:pointer;animation:hbPulse 2s infinite;';
      // animação
      var style=document.createElement('style');
      style.textContent='@keyframes hbPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}';
      document.head.appendChild(style);
      document.body.appendChild(btn);
      console.log('Botão exportar criado - modo admin ativo');
    }
    function esconderBotoesVisitantes(){
      if(admin) return;
      var bs=document.querySelectorAll("button");
      for(var i=0;i<bs.length;i++){
        var t=(bs[i].textContent||"").trim();
        if(t==="Adicionar produto"||t==="Editar perfil"||t==="Trocar foto"){
          bs[i].style.setProperty("display","none","important");
        }
      }
      var ps=document.querySelectorAll("p");
      for(var j=0;j<ps.length;j++){
        var p=ps[j].textContent||"";
        if(p.indexOf("Nenhum produto ainda")!==-1){ps[j].textContent="Em breve novidades por aqui";}
        if(p.indexOf("Clique em Adicionar produto")!==-1){ps[j].textContent="Fique de olho nas ofertas!";}
      }
    }
    // Se é admin, mostra botão exportar
    if(admin){
      criarBotaoExportar();
      document.addEventListener('DOMContentLoaded', criarBotaoExportar);
      setTimeout(criarBotaoExportar, 500);
      setTimeout(criarBotaoExportar, 1500);
      setTimeout(criarBotaoExportar, 3000);
      new MutationObserver(criarBotaoExportar).observe(document.documentElement,{childList:true,subtree:true});
      return;
    }
    // Se não é admin, esconde botões
    esconderBotoesVisitantes();
    new MutationObserver(esconderBotoesVisitantes).observe(document.documentElement,{childList:true,subtree:true});
  }catch(e){ console.log('erro gate', e); }
})();
</script>
